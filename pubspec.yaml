name: relay
description: "Relay: a Flutter SIP/WebRTC learning and reference application."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.1.0
  go_router: ^18.0.2
  sentry_flutter: ^9.30.1
  flutter_svg: ^2.3.0
  permission_handler: ^13.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  package_info_plus: ^10.2.2
  device_info_plus: ^13.3.0
  connectivity_plus: ^7.3.2
  wakelock_plus: ^1.8.1
  intl: ^0.20.3
  flutter_webrtc: ^1.6.2+hotfix.3
  sip_ua: ^1.1.0
  flutter_dotenv: ^6.0.1
  flex_color_scheme: ^9.0.0
  material_ui: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/brand/
    - assets/launcher/
    - assets/images/

# Generate only after the real source assets are supplied.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/icon.png
  adaptive_icon_background: "#F8F6F2"
  adaptive_icon_foreground: assets/launcher/icon-foreground.png
  adaptive_icon_monochrome: assets/launcher/icon-monochrome.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F8F6F2"
  image: assets/launcher/icon-foreground.png
  android: true
  ios: true
  web: false
  android_12:
    color: "#F8F6F2"
    image: assets/launcher/icon-foreground.png
    icon_background_color: "#F8F6F2"
