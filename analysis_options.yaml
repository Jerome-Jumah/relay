include: package:flutter_lints/flutter.yaml

analyzer:
  plugins:
    - custom_lint
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - packages/**

linter:
  rules:
    # Relay intentionally uses kebab-case filenames.
    file_names: false
